<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engenharia de Prompts aplicada ao Tribunal do Júri · MPPA</title>
<style>
:root{
  --bg:#070f1f;
  --bg2:#0a1730;
  --panel:#0f2040;
  --panel2:#0c1a36;
  --line:rgba(255,255,255,.10);
  --ink:#f2f5fb;
  --ink-dim:#a9b7d6;
  --ink-dimmer:#7688ab;
  --orange:#e8720c;
  --orange-ink:#ffb066;
  --navy:#1b3a6b;
  --red:#c62a3a;
  --hue:28;
  --accent: hsl(var(--hue) 78% 60%);
  --accent-soft: hsl(var(--hue) 78% 60% / .16);
  --accent-line: hsl(var(--hue) 78% 60% / .45);
  --fs-kicker: clamp(1rem, .35vw + .85rem, 1.3rem);
  --fs-h1: clamp(2.4rem, 3.2vw + 1.5rem, 4.6rem);
  --fs-h2: clamp(2.1rem, 2.3vw + 1.3rem, 3.5rem);
  --fs-h3: clamp(1.5rem, 1vw + 1.1rem, 2.1rem);
  --fs-body: clamp(1.25rem, .6vw + 1rem, 1.7rem);
  --fs-bullet: clamp(1.2rem, .55vw + .98rem, 1.6rem);
  --fs-small: clamp(1rem, .25vw + .85rem, 1.2rem);
  --fs-tiny: clamp(.85rem, .18vw + .74rem, 1rem);
  --fs-example: clamp(1.4rem, .8vw + 1.15rem, 2.05rem);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{position:fixed;inset:0;}
.stage{position:absolute;inset:0;top:8px;bottom:78px;overflow:hidden;}
.bgfx{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 700px at 82% -6%, hsl(var(--hue) 70% 45% / .16), transparent 60%),
    radial-gradient(900px 600px at -6% 108%, hsl(var(--hue) 70% 45% / .12), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  transition:background .5s ease;
}
.bgfx::before{
  content:"";position:absolute;inset:0;opacity:.35;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(1200px 800px at 70% 20%, #000 0%, transparent 75%);
}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,4vw,72px) clamp(36px,7vw,120px);
  opacity:0;transform:translateY(14px);
  transition:opacity .4s ease, transform .45s ease;
  pointer-events:none;z-index:1;
}
.slide.active{opacity:1;transform:translateY(0);pointer-events:auto;}
@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .15s linear;transform:none;}
}
.kicker{
  display:inline-flex;align-items:center;gap:.6em;
  font-size:var(--fs-kicker);font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:0 0 .8em 0;
}
.kicker .dot{width:.6em;height:.6em;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);}
h1.h1{font-size:var(--fs-h1);line-height:1.05;font-weight:800;margin:0 0 .3em 0;letter-spacing:-.01em;}
h2.h2{font-size:var(--fs-h2);line-height:1.08;font-weight:800;margin:0 0 .35em 0;letter-spacing:-.01em;}
h3.h3{font-size:var(--fs-h3);line-height:1.15;font-weight:800;margin:0 0 .5em 0;}
.lede{font-size:var(--fs-body);color:var(--ink-dim);line-height:1.5;max-width:56ch;margin:0 0 1em 0;}
.accent{color:var(--accent);}
.pill{
  display:inline-flex;align-items:center;gap:.5em;
  padding:.45em 1em;border-radius:999px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
  color:var(--accent);font-weight:700;font-size:var(--fs-small);
  letter-spacing:.03em;
}
.codepill{
  display:inline-block;padding:.3em .85em;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--ink-dim);font-size:var(--fs-tiny);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:.9em;
}

/* ---------- COVER ---------- */
.cover{align-items:flex-start;}
.cover-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:auto;}
.cover-logos{display:flex;align-items:center;gap:1.1em;}
.cover-logo{height:clamp(46px,4.6vw,74px);background:#fff;border-radius:8px;padding:.35em .5em;}
.cover-logo2{height:clamp(38px,3.7vw,58px);background:#fff;border-radius:8px;padding:.35em .5em;}
.cover-logo-sep{width:1px;align-self:stretch;background:var(--line);}
.cover-office{display:flex;align-items:center;gap:.7em;color:var(--ink-dim);font-size:var(--fs-small);font-weight:600;}
.cover-emblem{
  position:absolute;right:clamp(20px,6vw,120px);top:50%;transform:translateY(-50%);
  width:clamp(160px,20vw,320px);height:clamp(160px,20vw,320px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, rgba(232,114,12,.22), transparent 70%);
}
.cover-emblem img{width:78%;filter:drop-shadow(0 0 40px rgba(232,114,12,.55));}
.cover-emblem .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(232,114,12,.5);
  box-shadow:0 0 60px rgba(232,114,12,.25) inset;animation:spin 22s linear infinite;}
.cover-emblem .ring::before,.cover-emblem .ring::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange);}
.cover-emblem .ring::before{top:-4px;left:50%;margin-left:-4px;}
.cover-emblem .ring::after{bottom:-4px;left:50%;margin-left:-4px;}
@keyframes spin{to{transform:rotate(360deg);}}
.cover-title{max-width:64%;margin-top:2.2em;}
.cover-title .l1{display:block;font-size:var(--fs-h1);font-weight:800;color:var(--ink);line-height:1.05;}
.cover-title .l2{display:block;font-size:var(--fs-h1);font-weight:800;color:var(--orange);line-height:1.12;}
.cover-sub{font-size:var(--fs-h3);color:var(--ink-dim);font-weight:500;margin-top:.5em;max-width:52ch;}
.cover-bottom{display:flex;align-items:flex-end;justify-content:space-between;width:100%;margin-top:auto;padding-top:2em;border-top:1px solid var(--line);}
.cover-credit{font-size:var(--fs-small);color:var(--ink-dim);}
.cover-credit b{color:var(--ink);font-weight:700;}
.cover-tag{font-size:var(--fs-small);color:var(--ink-dimmer);text-align:right;}

/* ---------- AGENDA ---------- */
.agenda-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:16px 22px;margin-top:1.3em;max-width:1700px;
}
.agenda-card{
  display:flex;align-items:center;gap:1.1em;
  padding:1.15em 1.4em;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);
  border-left:6px solid hsl(var(--chue) 78% 58%);
  cursor:pointer;transition:transform .15s ease, background .15s ease;
}
.agenda-card:hover{transform:translateX(4px);background:var(--panel2);}
.agenda-card .num{font-size:var(--fs-small);color:var(--ink-dimmer);font-weight:700;min-width:1.6em;}
.agenda-card .ic{width:2.5em;height:2.5em;flex:none;color:hsl(var(--chue) 78% 62%);}
.agenda-card .tx{flex:1;min-width:0;}
.agenda-card .tx b{display:block;font-size:var(--fs-h3);font-weight:800;color:var(--ink);line-height:1.15;}
.agenda-card .tx span{display:block;font-size:var(--fs-small);color:var(--ink-dimmer);margin-top:.2em;}
.agenda-card .cnt{font-size:var(--fs-small);font-weight:700;color:hsl(var(--chue) 78% 62%);background:hsl(var(--chue) 78% 58% / .14);border-radius:999px;padding:.35em .85em;white-space:nowrap;}
@media(max-width:1100px){.agenda-grid{grid-template-columns:1fr;}}

/* ---------- PHILOSOPHY ---------- */
.phi-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;max-width:1500px;}
.phi-list{list-style:none;margin:1.1em 0 0;padding:0;display:flex;flex-direction:column;gap:.9em;}
.phi-list li{display:flex;gap:.8em;font-size:var(--fs-body);color:var(--ink-dim);line-height:1.45;}
.phi-list li b{color:var(--ink);}
.phi-list .num{flex:none;width:2em;height:2em;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-small);}
.phi-compare{display:flex;flex-direction:column;gap:16px;}
.phi-box{border-radius:16px;padding:1.1em 1.3em;border:1px solid var(--line);background:var(--panel);}
.phi-box.bad{opacity:.75;}
.phi-box .tag{font-size:var(--fs-tiny);font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.phi-box.bad .tag{color:#ef6a6a;}
.phi-box.good .tag{color:#59d698;}
.phi-box p{margin:.35em 0 0;color:var(--ink-dim);font-size:var(--fs-small);}
.phi-box.good{border-color:var(--accent-line);background:linear-gradient(180deg, var(--accent-soft), transparent);}

/* ---------- FLOW ---------- */
.flow{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin:1.4em 0;}
.flow-node{display:flex;flex-direction:column;align-items:center;gap:.5em;width:clamp(96px,10vw,150px);opacity:.5;transition:opacity .3s ease, transform .3s ease;}
.flow-node.active{opacity:1;transform:translateY(-4px);}
.flow-node .circ{
  width:clamp(46px,4.4vw,68px);height:clamp(46px,4.4vw,68px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-body);
  background:var(--panel);border:2px solid var(--line);color:var(--ink-dim);
  transition:all .3s ease;
}
.flow-node.active .circ{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 26px var(--accent-soft);}
.flow-node .lbl{font-size:var(--fs-tiny);text-align:center;color:var(--ink-dim);font-weight:600;line-height:1.25;}
.flow-node.active .lbl{color:var(--ink);font-weight:800;}
.flow-arrow{flex:none;align-self:center;color:var(--ink-dimmer);font-size:1.4rem;margin:0 -2px;padding-top:clamp(23px,2.2vw,34px);}
.flow-arrow.active{color:var(--accent);}

/* ---------- THEME DIVIDER ---------- */
.divider{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,48px);align-items:center;max-width:1500px;}
.divider-badge{
  width:clamp(90px,9vw,140px);height:clamp(90px,9vw,140px);border-radius:28px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
  display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;
}
.divider-badge svg{width:56%;height:56%;}
.divider-num{font-size:clamp(3rem,6vw,6rem);font-weight:800;color:var(--accent-soft);position:absolute;right:6%;top:8%;line-height:1;-webkit-text-stroke:1px var(--accent-line);}

/* ---------- AGENT SLIDE ---------- */
.agent-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);max-width:1800px;width:100%;align-items:start;}
.func-list{list-style:none;margin:1em 0 0;padding:0;display:flex;flex-direction:column;gap:.6em;}
.func-list li{display:flex;gap:.7em;align-items:flex-start;font-size:var(--fs-bullet);color:var(--ink-dim);line-height:1.4;}
.func-list li .chk{flex:none;width:1.5em;height:1.5em;margin-top:.1em;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.9em;font-weight:900;}
.example-box{
  margin-top:1.3em;border-radius:18px;padding:1.3em 1.5em;
  background:linear-gradient(180deg, var(--accent-soft), transparent);
  border:1px dashed var(--accent-line);
}
.example-box .et{font-size:var(--fs-small);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.5em;margin-bottom:.3em;}
.example-box p{margin:.35em 0 0;font-size:var(--fs-example);color:var(--ink);font-style:italic;line-height:1.48;font-weight:500;}
.example-box-media{display:flex;gap:1.5em;align-items:center;flex-wrap:wrap;}
.example-box-media .ex-text{min-width:220px;}
.example-box-media .ex-img{
  position:relative;flex:none;
  width:clamp(150px,17vw,260px);height:clamp(150px,17vw,260px);
  border-radius:22px;background:radial-gradient(circle at 50% 30%, hsl(var(--hue) 70% 45% / .30), transparent 70%), var(--panel);
  border:2px solid var(--accent-line);display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.example-box-media .ex-img img{width:86%;height:86%;object-fit:contain;
  filter:hue-rotate(calc((var(--hue) - 205) * 1deg)) saturate(1.15) drop-shadow(0 8px 16px rgba(0,0,0,.45));}
.example-box-media .ex-badge{
  position:absolute;right:-8px;bottom:-8px;width:2.6em;height:2.6em;border-radius:50%;
  background:var(--panel2);border:2px solid var(--accent);color:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.example-box-media .ex-badge svg{width:60%;height:60%;}
.example-box-media .ex-text{flex:1;min-width:0;}
.side-panel{border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:1.4em 1.5em;}
.side-panel h4{margin:0 0 .3em;font-size:var(--fs-tiny);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dimmer);font-weight:800;}
.side-panel .sc{font-size:var(--fs-small);color:var(--ink-dim);line-height:1.5;margin:0 0 1.1em;padding-bottom:1.1em;border-bottom:1px solid var(--line);}

/* ---------- CLOSING ---------- */
.closing{align-items:center;text-align:center;}
.closing .h1{max-width:20ch;margin-left:auto;margin-right:auto;}
.closing .lede{margin-left:auto;margin-right:auto;text-align:center;max-width:60ch;}
.closing-stats{display:flex;gap:clamp(20px,4vw,60px);margin:1.6em 0;flex-wrap:wrap;justify-content:center;}
.closing-stats div{text-align:center;}
.closing-stats b{display:block;font-size:clamp(2rem,3vw,3.2rem);font-weight:800;color:var(--orange);}
.closing-stats span{font-size:var(--fs-small);color:var(--ink-dim);}

/* ---------- CHROME ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:8px;z-index:20;background:rgba(255,255,255,.05);display:flex;}
.progress-seg{height:100%;flex:1;margin-right:2px;background:rgba(255,255,255,.06);position:relative;overflow:hidden;}
.progress-seg i{position:absolute;inset:0 auto 0 0;width:0%;background:hsl(var(--chue,28) 78% 58%);transition:width .25s ease;}
.footerbar{
  position:fixed;left:0;right:0;bottom:0;height:70px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,3vw,44px);
  background:linear-gradient(0deg, rgba(4,9,20,.96), rgba(4,9,20,.85));
  border-top:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.foot-left{display:flex;align-items:center;gap:.8em;min-width:0;}
.foot-left img{height:26px;background:#fff;border-radius:4px;padding:.15em .3em;}
.foot-left .ft-title{font-size:var(--fs-tiny);color:var(--ink-dimmer);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;}
@media(min-width:900px){.foot-left .ft-title{display:block;}}
.foot-center{display:flex;align-items:center;gap:.9em;color:var(--ink-dim);font-size:var(--fs-small);}
.theme-chip{display:flex;align-items:center;gap:.55em;font-weight:700;color:var(--ink);}
.theme-chip .d{width:.7em;height:.7em;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.foot-count{color:var(--ink-dimmer);font-variant-numeric:tabular-nums;}
.foot-right{display:flex;align-items:center;gap:.5em;}
.navbtn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.15rem;
  transition:background .15s ease, border-color .15s ease;
}
.navbtn:hover{background:rgba(255,255,255,.1);border-color:var(--accent-line);}
.navbtn:disabled{opacity:.3;cursor:default;}
.navbtn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}

/* ---------- MENU OVERLAY ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.94);backdrop-filter:blur(4px);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.overlay.open{opacity:1;pointer-events:auto;}
.overlay-head{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,60px);border-bottom:1px solid var(--line);}
.overlay-head h3{margin:0;font-size:var(--fs-h3);}
.overlay-body{flex:1;overflow-y:auto;padding:10px clamp(20px,4vw,60px) 40px;}
.overlay-close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:1.3rem;cursor:pointer;}
.mgroup{margin-top:22px;}
.mgroup-h{display:flex;align-items:center;gap:.6em;font-size:var(--fs-small);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--chue) 78% 62%);margin-bottom:.6em;}
.mgroup-h .d{width:.7em;height:.7em;border-radius:50%;background:hsl(var(--chue) 78% 58%);}
.mitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.mitem{padding:.7em .9em;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:var(--fs-small);color:var(--ink-dim);}
.mitem:hover{border-color:hsl(var(--chue) 78% 58% / .5);color:var(--ink);}
.mitem b{color:var(--ink);font-weight:700;}
.help-body{padding:22px clamp(20px,4vw,60px);max-width:640px;}
.help-body .row{display:flex;justify-content:space-between;padding:.7em 0;border-bottom:1px solid var(--line);font-size:var(--fs-body);color:var(--ink-dim);}
.help-body kbd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.2em .6em;color:var(--ink);font-family:inherit;font-weight:700;}
.hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,20,40,.9);
  border:1px solid var(--line);border-radius:999px;padding:.5em 1.2em;font-size:var(--fs-tiny);color:var(--ink-dim);
  opacity:0;transition:opacity .4s ease;pointer-events:none;}
.hint.show{opacity:1;}

@media(max-width:820px){
  .agent-wrap,.phi-wrap,.divider{grid-template-columns:1fr;}
  .cover-emblem{display:none;}
  .cover-title{max-width:100%;}
  .foot-left .ft-title,.foot-center{display:none;}
}

/* ---------- ANIMAÇÃO DO TEXTO EM LARANJA NO SLIDE 2 ---------- */
.agenda-card .tx span.orange-highlight {
  display: block !important;
  color: var(--orange-ink) !important;
  font-weight: 600 !important;
  font-size: var(--fs-small) !important;
  margin-top: 0.35em !important;
  opacity: 0;
  transform: translateY(10px);
  animation: pulseHighlight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.slide.active .agenda-card:nth-child(1) .tx span.orange-highlight { animation-delay: 0.2s; }
.slide.active .agenda-card:nth-child(2) .tx span.orange-highlight { animation-delay: 0.35s; }
.slide.active .agenda-card:nth-child(3) .tx span.orange-highlight { animation-delay: 0.5s; }
.slide.active .agenda-card:nth-child(4) .tx span.orange-highlight { animation-delay: 0.65s; }

@keyframes pulseHighlight {
  0% {
    opacity: 0;
    transform: translateY(10px);
    filter: drop-shadow(0 0 0px var(--orange));
  }
  50% {
    opacity: 1;
    filter: drop-shadow(0 0 12px var(--orange));
  }
  100% {
    opacity: 1;
    transform: translateY(0);
    filter: drop-shadow(0 0 4px rgba(232, 114, 12, 0.4));
  }
}

/* ---------- ANIMAÇÃO PARA OS CARDS DO SLIDE 6 (EVOLUÇÃO DO USUÁRIO) ---------- */
.step-card {
  opacity: 0;
  transform: translateY(28px) scale(0.96);
  transition: none;
}
.slide.active .step-card:nth-child(1) {
  animation: stepFadeIn 0.58s cubic-bezier(0.16, 1, 0.3, 1) 0.13s forwards;
}
.slide.active .step-card:nth-child(2) {
  animation: stepFadeIn 0.58s cubic-bezier(0.16, 1, 0.3, 1) 0.40s forwards;
}
.slide.active .step-card:nth-child(3) {
  animation: stepFadeIn 0.58s cubic-bezier(0.16, 1, 0.3, 1) 0.67s forwards;
}
.slide.active .step-card:nth-child(4) {
  animation: stepFadeIn 0.58s cubic-bezier(0.16, 1, 0.3, 1) 0.90s forwards;
}

@keyframes stepFadeIn {
  0% {
    opacity: 0;
    transform: translateY(28px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---------- RESPONSIVIDADE E LAYOUT FLUIDO PARA DISPOSITIVOS MÓVEIS ---------- */
@media (max-width: 820px) {
  .stage { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
  .slide { 
    position: relative !important; 
    min-height: 100% !important; 
    height: auto !important; 
    padding: 24px 20px 80px 20px !important; 
    justify-content: flex-start !important;
  }
  .slide:not(.active) { display: none !important; }
  .slide.active { display: flex !important; }
  .agent-wrap, .phi-wrap, .divider { grid-template-columns: 1fr !important; gap: 20px !important; }
  .phi-compare { grid-template-columns: 1fr !important; }
  .agenda-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
  .cover-title { max-width: 100% !important; margin-top: 1.2em !important; }
  .cover-sub { max-width: 100% !important; }
  .cover-top { flex-wrap: wrap; gap: 10px; }
  .cover-bottom { flex-direction: column; align-items: flex-start; gap: 12px; }
  .cover-tag { text-align: left; }
  .cover-emblem { display: none !important; }
  .foot-left .ft-title, .foot-center { display: none !important; }
  .footerbar { padding: 0 16px !important; }
  .navbtn { width: 38px !important; height: 38px !important; font-size: 1rem !important; }
  .mitems { grid-template-columns: 1fr !important; }
}

@media (max-height: 650px) {
  .slide { padding-top: 16px !important; padding-bottom: 70px !important; }
  .lede { margin-bottom: 0.6em !important; }
}
</style>

  let out=`<div class="flow">`;

    if(i>0) out+=`<div class="flow-arrow ${activeIdx!==-1 && i<=activeIdx?'active':''}">→</div>`;

  });
  out+=`</div>`;
  return out;
}

        Edição Especial <b>Paulo Lima II</b> · Evento: 14 e 15 de maio de 2025
      </div>
      <div class="cover-tag">
        <b>CIIA — MPPA</b><br>
        Comitê de Governança de Inovação e Inteligência Artificial<br>
        <span style="color:var(--accent)">ciia.mppa.mp.br</span>
      </div>
    </div>
  </div>`
});


/* ============================= RENDER / NAV ============================= */
const stage = document.getElementById('stage');
slides.forEach((s,i)=>{
  const wrap=document.createElement('div');
  wrap.innerHTML=s.html.trim();
  const el=wrap.firstChild;
  el.dataset.hue=s.hue;
  el.dataset.index=i;
  stage.appendChild(el);
});

const topbar = document.getElementById('topbar');
const segMeta = [];
{
  let acc=0;
  let curHue=slides[0].hue, curCount=0;
  slides.forEach((s,i)=>{
    if(s.hue!==curHue){ segMeta.push({hue:curHue,count:curCount}); curHue=s.hue; curCount=0; }
    curCount++;
  });
  segMeta.push({hue:curHue,count:curCount});
}
segMeta.forEach(seg=>{
  const d=document.createElement('div');
  d.className='progress-seg';
  d.style.setProperty('--chue',seg.hue);
  d.dataset.count=seg.count;
  d.innerHTML='<i></i>';
  topbar.appendChild(d);
});

let current=0;
const els = Array.from(stage.querySelectorAll('.slide'));
const bgfx = document.getElementById('bgfx');
const chipLabel = document.getElementById('chipLabel');
const slideCount = document.getElementById('slideCount');
const btnPrev=document.getElementById('btnPrev'), btnNext=document.getElementById('btnNext');

function segIndexForSlide(i){
  let acc=0;
  for(let s=0;s<segMeta.length;s++){
    acc+=segMeta[s].count;
    if(i<acc) return s;
  }
  return segMeta.length-1;
}
function offsetWithinSeg(i){
  let acc=0;
  for(let s=0;s<segMeta.length;s++){
    if(i<acc+segMeta[s].count) return i-acc;
    acc+=segMeta[s].count;
  }
  return 0;
}

function goTo(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  els[current].classList.remove('active');
  current=i;
  const el=els[current];
  el.classList.add('active');
  document.body.style.setProperty('--hue', slides[current].hue);
  bgfx.style.setProperty('--hue', slides[current].hue);
  document.documentElement.style.setProperty('--hue', slides[current].hue);
  chipLabel.textContent = slides[current].theme;
  slideCount.textContent = (current+1)+' / '+slides.length;
  btnPrev.disabled = current===0;
  const segEls = topbar.querySelectorAll('.progress-seg');
  const activeSeg = segIndexForSlide(current);
  segEls.forEach((se,idx)=>{
    const bar=se.querySelector('i');
    if(idx<activeSeg) bar.style.width='100%';
    else if(idx>activeSeg) bar.style.width='0%';
    else {
      const within=offsetWithinSeg(current)+1;
      bar.style.width=(within/segMeta[idx].count*100)+'%';
    }
  });
  window.scrollTo(0,0);
}

btnPrev.addEventListener('click',()=>goTo(current-1));
btnNext.addEventListener('click',()=>goTo(current+1));

document.addEventListener('keydown',(e)=>{
  if(menuOverlay.classList.contains('open') || helpOverlay.classList.contains('open')){
    if(e.key==='Escape'){ closeOverlays(); }
    return;
  }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(current+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(current-1); }
  else if(e.key==='Home'){ goTo(0); }
  else if(e.key==='End'){ goTo(slides.length-1); }
  else if(e.key==='m' || e.key==='M'){ openMenu(); }
  else if(e.key==='f' || e.key==='F'){ toggleFullscreen(); }
  else if(e.key==='?'){ openHelp(); }
});

/* click zones on stage edges for quick nav */
stage.addEventListener('click',(e)=>{
  const w=window.innerWidth;
  if(e.target.closest('.agenda-card')) return;
  if(e.clientX < w*0.08) goTo(current-1);
  else if(e.clientX > w*0.92) goTo(current+1);
});

stage.addEventListener('click',(e)=>{
  const card=e.target.closest('.agenda-card');
  if(card){
    const idx=slides.findIndex(s=>s.id===card.dataset.jump);
    if(idx>-1) goTo(idx);
  }
});

/* fullscreen */
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
document.getElementById('btnFull').addEventListener('click',toggleFullscreen);

/* menu overlay */
const menuOverlay=document.getElementById('menuOverlay');
const menuBody=document.getElementById('menuBody');
const helpOverlay=document.getElementById('helpOverlay');

function buildMenu(){
  let html='';
  let order=1;
  const item = (index, label) => `<div class="mitem" data-i="${index}" style="display:flex;align-items:center;gap:12px;padding:0.7em 0.9em"><span class="mnum" style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800">${order++}</span><b style="font-weight:600;color:var(--ink);line-height:1.35">${label}</b></div>`;

  html += `<div class="mgroup"><div class="mgroup-h" style="--chue:28"><span class="d"></span>Fundamentos & Estrutura</div><div class="mitems">
    ${item(0, 'Engenharia de Prompts aplicada ao Tribunal do Júri')}
    ${item(1, 'Sumário Executivo & Agenda da Apresentação')}
    ${item(2, 'O que é Engenharia de Prompts?')}
    ${item(3, 'Os 4 Pilares de um Bom Prompt')}
  </div></div>`;

  html += `<div class="mgroup"><div class="mgroup-h" style="--chue:196"><span class="d"></span>Técnicas Avançadas & Maturidade</div><div class="mitems">
    ${item(4, 'Metaprompting: Use a IA para Desenhar seus Comandos')}
    ${item(5, 'A Evolução do Usuário: De Respostas Rápidas a Raciocínio Complexo')}
  </div></div>`;

  html += `<div class="mgroup"><div class="mgroup-h" style="--chue:355"><span class="d"></span>Antipadrões & Os 5 Erros Críticos</div><div class="mitems">
    ${item(6, 'Como NÃO Usar a IA')}
    ${item(7, 'Erro 1: A Persona Inflada')}
    ${item(8, 'Erro 2: O Prompt Genérico')}
    ${item(9, 'Erro 3: Misturar Análise e Redação')}
    ${item(10, 'Erro 4: Comandos Negativos (Sem Contraponto)')}
    ${item(11, 'Erro 5: O Princípio do Trade-off no Excesso de Instruções')}
  </div></div>`;

  html += `<div class="mgroup"><div class="mgroup-h" style="--chue:158"><span class="d"></span>Foco Cognitivo, Riscos & Síntese</div><div class="mitems">
    ${item(12, 'O Padrão Oculto: A Gestão do Foco Cognitivo')}
    ${item(13, 'O Fator Humano: Limitações Técnicas Críticas')}
    ${item(14, 'A Partitura Perfeita: Síntese Estratégica')}
    ${item(15, 'Observação e Adaptação: O Maestro da Orquestra')}
    ${item(16, 'Encerramento da Apresentação · MPPA')}
  </div></div>`;

  menuBody.innerHTML=html;
  menuBody.querySelectorAll('.mitem').forEach(it=>{
    it.addEventListener('click',()=>{ goTo(parseInt(it.dataset.i,10)); closeOverlays(); });
  });
}

function openMenu(){ menuOverlay.classList.add('open'); }
function openHelp(){ helpOverlay.classList.add('open'); }
function closeOverlays(){ menuOverlay.classList.remove('open'); helpOverlay.classList.remove('open'); }
document.getElementById('btnMenu').addEventListener('click',openMenu);
document.getElementById('btnHelp').addEventListener('click',openHelp);
document.getElementById('menuClose').addEventListener('click',closeOverlays);
document.getElementById('helpClose').addEventListener('click',closeOverlays);
menuOverlay.addEventListener('click',(e)=>{ if(e.target===menuOverlay) closeOverlays(); });
helpOverlay.addEventListener('click',(e)=>{ if(e.target===helpOverlay) closeOverlays(); });

/* first-run hint */
const hint=document.getElementById('hint');
setTimeout(()=>hint.classList.add('show'),600);
setTimeout(()=>hint.classList.remove('show'),4200);

/* init */
buildMenu();
goTo(0);
</script>
